<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 12px; margin: 0; padding: 10px; color: #ddd; }
    h1 { font-size: 13px; margin: 0 0 8px 0; letter-spacing: 0.02em; }
    .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    .row label { min-width: 74px; color: #aaa; }
    input[type=text] { flex: 1; font-size: 11px; padding: 3px 5px; background: #222; color: #eee; border: 1px solid #444; border-radius: 3px; }
    button { font-size: 11px; padding: 3px 9px; background: #2f2f2f; color: #eee; border: 1px solid #555; border-radius: 3px; }
    button:hover { background: #3a3a3a; }
    #status { padding: 6px 8px; border-radius: 4px; background: #1f1f1f; border-left: 3px solid #666; margin: 8px 0; }
    #status.live { border-left-color: #3ec26b; }
    #status.err  { border-left-color: #e05555; }
    #log { font-family: Menlo, monospace; font-size: 10px; white-space: pre-wrap; background: #161616; border: 1px solid #333; border-radius: 3px; padding: 6px; height: 160px; overflow-y: auto; color: #bbb; }
    .muted { color: #888; }
    .warn { color: #e0a955; }
  </style>
</head>
<body>
  <h1>Agent Bridge <span class="muted" id="version"></span></h1>

  <div id="status">starting…</div>

  <div class="row">
    <label for="dir">Bridge dir</label>
    <input type="text" id="dir" />
  </div>
  <div class="row">
    <button id="toggle">Pause</button>
    <button id="pingBtn">Self-test</button>
    <button id="clearBtn">Clear log</button>
  </div>
  <div class="row">
    <input type="checkbox" id="allowEval" checked />
    <label for="allowEval" style="min-width:0">allow <code>eval</code> commands <span class="warn">(agent can run any UXP code)</span></label>
  </div>

  <div id="log"></div>
  <script src="index.js"></script>
</body>
</html>
